<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NS Performance</title><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/vuetify@3/dist/vuetify.min.css"><script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script><script src="https://cdn.jsdelivr.net/npm/vuetify@3/dist/vuetify.min.js"></script><style>@import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Manrope:wght@400;600;800&display=swap');:root{--b:#090a0b;--n:#e8baff;--s:#d7ff36;--w:#f5f2ed;--g:#aeb6af}*{box-sizing:border-box}html{scroll-snap-type:y proximity;scroll-behavior:smooth}body{margin:0;background:var(--b);color:white;font-family:Manrope}.nav{position:fixed;z-index:9;top:0;left:50%;transform:translateX(-50%);width:min(1260px,calc(100% - 44px));height:72px;display:flex;justify-content:space-between;align-items:center;mix-blend-mode:difference}.brand,h1,h2,h3{font-family:'Barlow Condensed';text-transform:uppercase;letter-spacing:-.04em}.brand{font-size:1.7rem;font-weight:800;letter-spacing:.1em}.brand i{color:var(--s);font-style:normal}.tag{font-size:.65rem;letter-spacing:.13em;text-transform:uppercase}button{cursor:pointer;border:0;font:800 .7rem Manrope;text-transform:uppercase;letter-spacing:.09em;padding:15px 19px;background:var(--s);color:#111}.screen{min-height:100svh;position:relative;overflow:hidden;scroll-snap-align:start}.hero{display:grid;grid-template-columns:1fr 1fr}.person{position:relative;overflow:hidden}.person img,.about img,.history img,.compare img{width:100%;height:100%;object-fit:cover}.person:after,.history:after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,#000d,transparent 65%)}.person div{position:absolute;z-index:1;left:9%;bottom:11%;max-width:330px}.neusa .tag{color:var(--n)}.sergio .tag{color:var(--s)}h1{font-size:clamp(3.8rem,7vw,7rem);line-height:.72;margin:18px 0}.person p,.about p,.history p{font-size:.94rem;line-height:1.55}.about{display:grid;grid-template-columns:46% 54%;background:var(--n);color:#1c1420}.about.sergio{grid-template-columns:54% 46%;background:#171d18;color:white}.copy{padding:125px 10vw 62px;display:flex;flex-direction:column;justify-content:space-between}.about h2,.history h2,.results h2{font-size:clamp(4.6rem,9vw,9rem);line-height:.7;margin:20px 0}.sergio h2{color:var(--s)}.about .image{position:relative}.about .image:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#e8baff99,transparent)}.sergio .image:after{background:linear-gradient(90deg,transparent,#171d18)}.history{display:grid;grid-template-columns:58% 42%;position:relative;background:#111}.history.sergio{grid-template-columns:42% 58%;background:#202619}.history img{position:absolute;inset:0;width:100%;height:100%;filter:contrast(1.1)}.history .story{position:relative;z-index:1;align-self:end;padding:80px;max-width:570px}.history.sergio .story{grid-column:2}.history .story p{color:#e7e7e4}.history h2{font-size:clamp(4.5rem,8vw,8rem)}.results{background:#101213;padding:100px max(24px,calc((100% - 1150px)/2))}.results.sergio{background:#101711}.head{display:flex;justify-content:space-between;gap:30px;align-items:end}.head p{max-width:300px;color:var(--g);font-size:.85rem}.compare{height:min(62vw,650px);position:relative;overflow:hidden;margin-top:32px}.compare .after{position:absolute;inset:0;clip-path:inset(0 0 0 50%);filter:saturate(1.2)}.bar{position:absolute;z-index:2;left:50%;top:0;bottom:0;width:2px;background:white}.bar:after{content:"↔";position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:white;color:#111;border-radius:50%;width:48px;height:48px;display:grid;place-items:center}.compare input{position:absolute;z-index:3;inset:0;width:100%;opacity:0;cursor:ew-resize}.label{position:absolute;z-index:2;bottom:18px;padding:7px;background:#0009;font-size:.65rem;letter-spacing:.1em}.left{left:18px}.right{right:18px}.final{display:grid;place-items:center;text-align:center;padding:70px;background:radial-gradient(circle,#354136,var(--b) 65%)}.final h2{font:800 clamp(4rem,10vw,10rem)/.7 'Barlow Condensed';text-transform:uppercase;max-width:900px}.final i{color:var(--n)}.reveal{opacity:0;transform:translateY(30px);transition:.7s}.reveal.on{opacity:1;transform:none}.dialog-card{background:var(--w)!important;color:#111!important}.dialog-title{font:800 3.2rem/.75 'Barlow Condensed';text-transform:uppercase}@media(max-width:760px){.nav{width:calc(100% - 32px)}.nav .tag{display:none}.hero,.about,.about.sergio,.history,.history.sergio{grid-template-columns:1fr}.person{min-height:50svh}.person h1{font-size:3.4rem}.copy{padding:85px 24px 45px;min-height:55svh}.about .image{min-height:45svh;order:2}.history .story,.history.sergio .story{grid-column:1;padding:90px 24px 48px;align-self:end}.results{padding:75px 16px}.head{display:block}.compare{height:94vw}.final h2{font-size:5rem}}</style></head><body><div id="app"><nav class="nav"><span class="brand">N<i>/</i>S</span><span class="tag">performance personalizada</span><button @click="dialog=true">Aplicar agora</button></nav><main><section class="screen hero"><article v-for="p in people" :class="'person '+p.id"><img :src="p.hero"><div><span class="tag">{{p.label}}</span><h1>{{p.heroText}}</h1><p>{{p.lead}}</p></div></article></section><template v-for="p in people"><section :class="'screen about '+p.id"><div class="copy reveal"><div><span class="tag">Consultoria personalizada</span><h2>{{p.title}}</h2><p>{{p.description}}</p></div><button @click="dialog=true">Falar com {{p.name}} →</button></div><div class="image"><img :src="p.feature"></div></section><section :class="'screen history '+p.id"><img :src="p.historyImage"><div class="story reveal"><span class="tag">A história</span><h2>{{p.historyTitle}}</h2><p>{{p.history}}</p></div></section><section :class="'screen results '+p.id"><div class="head reveal"><div><span class="tag">Histórias de evolução</span><h2>Antes<br><span :style="{color:p.color}">e depois.</span></h2></div><p>Uma apresentação visual da jornada de treino, rotina e consistência acompanhada por {{p.name}}.</p></div><div class="compare reveal"><img :src="p.before"><img class="after" :src="p.after" :style="{clipPath:'inset(0 0 0 '+p.value+'%)'}"><i class="bar" :style="{left:p.value+'%'}"></i><span class="label left">ANTES</span><span class="label right">DEPOIS</span><input type="range" min="0" max="100" v-model="p.value"></div></section></template><section class="screen final"><div class="reveal"><span class="tag">Seu próximo passo</span><h2>Não é só treino.<br><i>É transformação.</i></h2><button @click="dialog=true">Começar agora →</button></div></section></main><v-dialog v-model="dialog" max-width="540"><v-card class="dialog-card pa-7 rounded-lg"><v-btn variant="text" class="float-right" @click="dialog=false">×</v-btn><div class="tag">Primeiro passo</div><div class="dialog-title mt-3 mb-5">Vamos conversar?</div><p class="mb-5">Conte como podemos ajudar. A equipe retorna para entender seu objetivo.</p><v-form @submit.prevent="sent=true"><v-text-field label="Nome" required></v-text-field><v-text-field label="WhatsApp" required></v-text-field><v-select label="Quero falar com" :items="['Neusa','Sérgio','Os dois']" required></v-select><v-btn type="submit" block color="black" size="large">Enviar interesse →</v-btn><div v-if="sent" class="mt-4 font-weight-bold text-green-darken-2">Recebemos seu interesse.</div></v-form></v-card></v-dialog></div><script>const{createApp}=Vue;const app=createApp({data(){return{dialog:false,sent:false,people:[{id:'neusa',name:'Neusa',label:'Ela / performance feminina',heroText:'Força com intenção.',lead:'Uma estratégia consistente para cada fase do seu corpo.',title:'O corpo muda. Você cresce.',description:'Treino e acompanhamento para mulheres que desejam mais força, confiança e liberdade no próprio ritmo.',historyTitle:'Mais que treino.',history:'Uma trajetória construída com proximidade, escuta e um olhar individual para transformar a forma como cada mulher vive o próprio corpo.',hero:'assets/neusa-hero.jpg',feature:'assets/neusa-training.jpg',historyImage:'assets/neusa.jpg',before:'assets/neusa-hero.jpg',after:'assets/neusa-training.jpg',color:'var(--n)',value:50},{id:'sergio',name:'Sérgio',label:'Ele / performance masculina',heroText:'Físico com propósito.',lead:'Direção técnica para construir performance de verdade.',title:'Ciência, peso e palco.',description:'Treino estruturado para quem quer evoluir físico, performance e disciplina com direção técnica.',historyTitle:'Técnica que acompanha.',history:'Da preparação física ao trabalho com atletas, a história é feita de consistência, conhecimento e respeito pelo processo de cada aluno.',hero:'assets/sergio-hero.jpg',feature:'assets/sergio-coaching.jpg',historyImage:'assets/sergio-athlete.jpg',before:'assets/sergio-portrait.jpg',after:'assets/sergio-coaching.jpg',color:'var(--s)',value:50}]}},mounted(){console.assert(this.people.length===2,'Perfis indisponíveis');document.querySelectorAll('.reveal').forEach(e=>new IntersectionObserver(x=>x.forEach(i=>i.isIntersecting&&i.target.classList.add('on')),{threshold:.15}).observe(e))}});app.use(Vuetify.createVuetify());app.mount('#app')</script></body></html>
